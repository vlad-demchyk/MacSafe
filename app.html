<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MacSafe</title>
  <style>
    html, body { height:100%; margin:0; }
    body { display:flex; align-items:center; justify-content:center; background:#08111f; color:#eaf0f8;
      font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Arial,sans-serif; text-align:center; padding:24px; }
    p { color:#acbbcd; margin:8px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1 style="font-size:22px;margin:0" data-en="No report yet">Звіту ще немає</h1>
    <p data-en="Click “Run check” in the top bar. The first report appears when it finishes.">Натисніть «Запустити перевірку» у верхній панелі. Перший звіт з'явиться після завершення.</p>
  </main>
  <script>
    // Мова за параметром ?lang (його передає застосунок) або за мовою браузера
    (() => {
      const lang = new URLSearchParams(location.search).get('lang') || ((navigator.language || '').toLowerCase().startsWith('uk') ? 'uk' : 'en');
      if (lang !== 'en') return;
      document.documentElement.lang = 'en';
      document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.dataset.en; });
    })();
  </script>
</body>
</html>
